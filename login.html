<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar — Reforma Araucária</title>
<style>
  :root {
    --petroleo-profundo: #052d33;
    --petroleo-escuro: #072f34;
    --verde-acinzentado: #1a3f44;
    --limao: #b1e445;
    --limao-claro: #aadf3d;
    --cinza-azulado: #6f8789;
    --cinza-azulado-medio: #586774;
    --branco-acinzentado: #f5f8f7;
    --branco-puro: #fefefe;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    background: var(--branco-acinzentado);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    background: var(--branco-puro);
    padding: 2.5rem;
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(5, 45, 51, 0.1);
    width: 90%;
    max-width: 360px;
    text-align: center;
  }
  .logo {
    width: 76px;
    height: auto;
    margin-bottom: 1.25rem;
  }
  h1 {
    font-size: 1.2rem;
    margin: 0 0 1.75rem;
    color: var(--petroleo-profundo);
    font-weight: 700;
  }
  a.botao {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .6rem;
    padding: .8rem 1rem;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    margin-bottom: .75rem;
    border: 1.5px solid var(--cinza-azulado);
    color: var(--verde-acinzentado);
    transition: all .15s ease;
  }
  a.botao:hover {
    border-color: var(--limao-claro);
    background: var(--branco-acinzentado);
  }
  .erro {
    color: #c0392b;
    font-size: .85rem;
    margin-top: 1rem;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo.png" alt="Reforma Araucária" />
    <h1>Acessar Reforma Araucária</h1>
    <a class="botao google" href="/api/auth/google">Entrar com Google</a>
    <a class="botao microsoft" href="/api/auth/microsoft">Entrar com Microsoft</a>
    <div class="erro" id="erro"></div>
  </div>
  <script>
    var params = new URLSearchParams(location.search);
    var erro = params.get('erro');
    if (erro) {
      var etapaMsgs = {
        leitura_token: 'Leitura da resposta de autenticação Microsoft',
        consulta_perfil: 'Consulta do perfil Microsoft',
        usuario_sessao: 'Consulta do usuário no D1 ou criação da sessão',
        callback: 'Processamento do retorno Microsoft'
      };
      var msgs = {
        bloqueado: 'Seu acesso foi bloqueado. Fale com o administrador.',
        state: 'Falha na validação do login. Tente novamente.',
        token: 'Não foi possível confirmar seu login. Tente novamente.',
        perfil: 'A Microsoft autenticou, mas não conseguimos consultar seu perfil. Tente novamente ou fale com o administrador.',
        microsoft_cancelado: 'O login com a Microsoft foi cancelado.',
        microsoft: 'A Microsoft não conseguiu concluir o login. Verifique a configuração da aplicação ou tente outra conta.',
        interno: 'Ocorreu uma falha ao concluir o login. Tente novamente; se persistir, informe o administrador.',
        sem_email: 'Não conseguimos obter seu e-mail. Tente outra conta.'
      };
      var etapa = params.get('etapa');
      var detalheEtapa = etapaMsgs[etapa];
      document.getElementById('erro').textContent = (msgs[erro] || 'Erro ao entrar.') +
        (erro === 'interno' && detalheEtapa ? ' Etapa: ' + detalheEtapa + '.' : '');
    }
  </script>
</body>
</html>
