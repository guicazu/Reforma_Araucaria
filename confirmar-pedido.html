<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmar recebimento — Pedido de Compra</title>
<style>
  :root{--navy:#1d3a5f;--gold:#c9a23a;--verde:#1f8a4c;--suave:#6b7685;--borda:#e3e7ee}
  *{box-sizing:border-box}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#f4f6fa;margin:0;padding:24px;color:#1d2733}
  .card{max-width:480px;margin:40px auto;background:#fff;border:1px solid var(--borda);border-radius:14px;padding:28px;box-shadow:0 4px 18px rgba(20,30,50,.06)}
  h1{font-size:18px;color:var(--navy);margin:0 0 4px}
  p.sub{color:var(--suave);font-size:13px;margin:0 0 20px}
  .linha{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--borda);font-size:14px}
  .linha span:first-child{color:var(--suave)}
  .total{font-size:20px;font-weight:800;color:var(--navy);text-align:right;margin-top:10px}
  button{width:100%;margin-top:22px;background:var(--verde);color:#fff;border:none;border-radius:8px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
  button:disabled{background:#9db6a3;cursor:default}
  .ok{color:var(--verde);font-weight:700;text-align:center;padding:14px;background:#eafaf0;border-radius:8px;margin-top:16px}
  .erro{color:#b42318;font-weight:700;text-align:center;padding:14px;background:#fdecea;border-radius:8px;margin-top:16px}
</style>
</head>
<body>
<div class="card" id="card">Carregando...</div>
<script>
(function(){
  var token = new URLSearchParams(location.search).get('token');
  var card = document.getElementById('card');
  function fmtBRL(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }

  if (!token) { card.innerHTML = '<div class="erro">Link inválido.</div>'; return; }

  fetch('/api/compras/confirmar/' + encodeURIComponent(token))
    .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
    .then(function(data){
      var p = data.pedido;
      var jaConfirmado = !!p.confirmadoEm;
      card.innerHTML =
        '<h1>Pedido de Compra ' + p.numero + '</h1>' +
        '<p class="sub">Reforma Araucária — iBuild Construtora</p>' +
        '<div class="linha"><span>Fornecedor</span><span>' + p.fornecedorNome + '</span></div>' +
        '<div class="linha"><span>Emitido em</span><span>' + (p.dataEmissao||'').slice(0,10) + '</span></div>' +
        '<div class="total">' + fmtBRL(p.valorTotal) + '</div>' +
        (jaConfirmado
          ? '<div class="ok">✓ Recebimento já confirmado em ' + new Date(p.confirmadoEm).toLocaleString('pt-BR') + '</div>'
          : '<button id="btnConfirmar">Confirmar recebimento deste pedido</button>');

      var btn = document.getElementById('btnConfirmar');
      if (btn) btn.addEventListener('click', function(){
        btn.disabled = true; btn.textContent = 'Confirmando...';
        fetch('/api/compras/confirmar/' + encodeURIComponent(token), { method: 'POST' })
          .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
          .then(function(){
            btn.outerHTML = '<div class="ok">✓ Recebimento confirmado com sucesso. Obrigado!</div>';
          })
          .catch(function(){
            btn.disabled = false; btn.textContent = 'Confirmar recebimento deste pedido';
            card.insertAdjacentHTML('beforeend', '<div class="erro">Não foi possível confirmar. Tente novamente.</div>');
          });
      });
    })
    .catch(function(){ card.innerHTML = '<div class="erro">Link inválido ou expirado.</div>'; });
})();
</script>
</body>
</html>
